<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación de Madurez PMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg:           #F2F0EB;
      --surface:      #FFFFFF;
      --text:         #1C1917;
      --muted:        #78716C;
      --border:       #E5E2DB;
      --radius:       18px;
      --shadow:       0 1px 3px rgba(0,0,0,.05), 0 8px 32px rgba(0,0,0,.08);

      /* Category — overridden dynamically */
      --cat:          #1B3575;
      --cat-light:    #EEF2FF;
      --cat-rgb:      27,53,117;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Progress bar ─────────────────────────────────────── */
    #progressTrack {
      position: fixed; top: 0; left: 0; right: 0;
      height: 3px; background: var(--border); z-index: 200;
      display: none;
    }
    #progressFill {
      height: 100%; background: var(--cat);
      transition: width .5s ease, background .4s ease;
    }

    /* ─── App shell ────────────────────────────────────────── */
    #app {
      display: flex; flex-direction: column; align-items: center;
      padding: 72px 16px 100px; min-height: 100vh;
    }

    /* ─── Animations ───────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-up { animation: fadeUp .35s cubic-bezier(.22,.68,0,1.2) forwards; }

    /* ─── Loading ──────────────────────────────────────────── */
    .screen-loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; min-height: 80vh;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    .loading-text { font-size: 14px; color: var(--muted); }

    /* ─── Card ─────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%; max-width: 640px;
      padding: 36px;
    }

    /* ─── Registration ─────────────────────────────────────── */
    .reg-logo {
      font-size: 11px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }
    .reg-title {
      font-family: 'Fraunces', serif;
      font-size: 30px; font-weight: 600; line-height: 1.2;
      margin-bottom: 10px;
    }
    .reg-sub {
      font-size: 14px; color: var(--muted);
      line-height: 1.65; margin-bottom: 32px;
    }
    .reg-sub strong { color: var(--text); }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .form-input {
      width: 100%; padding: 13px 16px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      color: var(--text); background: var(--surface);
      transition: border-color .2s, box-shadow .2s; outline: none;
    }
    .form-input:focus {
      border-color: var(--cat);
      box-shadow: 0 0 0 3px rgba(var(--cat-rgb),.1);
    }
    .form-input::placeholder { color: #C8BFB8; }
    .form-input.error { border-color: #E87820; }

    /* ─── Buttons ──────────────────────────────────────────── */
    .btn-primary {
      width: 100%; padding: 15px 24px;
      background: var(--text); color: white;
      border: none; border-radius: 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity .2s, transform .1s;
      margin-top: 4px;
    }
    .btn-primary:hover:not(:disabled) { opacity: .85; }
    .btn-primary:active { transform: scale(.99); }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; }

    .btn-cat {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 15px 36px;
      background: var(--cat); color: white;
      border: none; border-radius: 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    .btn-cat:hover { opacity: .85; }

    .btn-back {
      flex: 0 0 auto; padding: 13px 20px;
      border: 1.5px solid var(--border); border-radius: 11px;
      background: var(--surface); color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all .18s;
    }
    .btn-back:hover { border-color: var(--text); color: var(--text); }

    .btn-next {
      flex: 1; padding: 15px 24px;
      background: var(--cat); color: white;
      border: none; border-radius: 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    .btn-next:hover:not(:disabled) { opacity: .85; }
    .btn-next:disabled { opacity: .3; cursor: not-allowed; }

    /* ─── Category Intro ───────────────────────────────────── */
    .cat-intro {
      width: 100%; max-width: 560px;
      text-align: center; padding: 40px 16px;
    }
    .cat-orb {
      width: 88px; height: 88px;
      border-radius: 50%; background: var(--cat);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; margin: 0 auto 28px;
      box-shadow: 0 8px 32px rgba(var(--cat-rgb),.25);
    }
    .cat-badge-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 18px; border-radius: 99px;
      background: var(--cat-light); color: var(--cat);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 18px;
    }
    .cat-heading {
      font-family: 'Fraunces', serif;
      font-size: 42px; font-weight: 600; line-height: 1.1;
      color: var(--text); margin-bottom: 16px;
    }
    .cat-desc {
      font-size: 16px; color: var(--muted);
      line-height: 1.75; margin-bottom: 20px;
    }
    .cat-count-label {
      font-size: 14px; font-weight: 600;
      color: var(--cat); margin-bottom: 36px;
    }

    /* ─── Service Card ─────────────────────────────────────── */
    .svc-meta {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 20px;
    }
    .svc-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 13px; border-radius: 99px;
      background: var(--cat-light); color: var(--cat);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .svc-counter { font-size: 12px; color: var(--muted); font-weight: 500; }

    .svc-name {
      font-family: 'Fraunces', serif;
      font-size: 26px; font-weight: 600; line-height: 1.25;
      margin-bottom: 10px;
    }
    .svc-desc {
      font-size: 14px; color: var(--muted);
      line-height: 1.65; margin-bottom: 28px;
    }

    /* Divider */
    .divider {
      height: 1px; background: var(--border);
      margin: 24px 0;
    }

    /* ─── Applies selector ─────────────────────────────────── */
    .section-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px;
    }
    .applies-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 28px;
    }
    .applies-opt {
      display: flex; flex-direction: column;
      align-items: center; gap: 7px; padding: 16px 8px 14px;
      border: 2px solid var(--border); border-radius: 13px;
      cursor: pointer; transition: all .18s;
      background: var(--surface); text-align: center;
    }
    .applies-opt:hover {
      border-color: var(--cat); background: var(--cat-light);
    }
    .applies-opt.sel {
      border-color: var(--cat); background: var(--cat-light);
    }
    .applies-emoji { font-size: 22px; line-height: 1; }
    .applies-label-text { font-size: 13px; font-weight: 600; color: var(--text); }
    .applies-hint { font-size: 10px; color: var(--muted); line-height: 1.3; }

    /* ─── Levels section ───────────────────────────────────── */
    #levelsSection { animation: fadeIn .28s ease; }

    .levels-block { margin-bottom: 22px; }
    .levels-header {
      display: flex; align-items: baseline;
      gap: 8px; margin-bottom: 12px;
    }
    .levels-title {
      font-size: 11px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      color: var(--muted);
    }
    .levels-required {
      font-size: 10px; color: #E87820; font-weight: 600;
    }
    .levels-optional {
      font-size: 10px; color: var(--muted);
    }

    .level-cards {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    }
    .lcard {
      display: flex; flex-direction: column;
      align-items: center; padding: 12px 4px 10px;
      border: 2px solid var(--border); border-radius: 12px;
      cursor: pointer; transition: all .15s;
      background: var(--surface); text-align: center;
      position: relative;
    }
    .lcard:hover:not(.sel) {
      border-color: var(--cat);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(var(--cat-rgb),.15);
    }
    .lcard.sel {
      border-color: var(--cat); background: var(--cat);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(var(--cat-rgb),.25);
    }
    .lcard-num {
      font-family: 'Fraunces', serif;
      font-size: 22px; font-weight: 600;
      color: var(--text); line-height: 1; margin-bottom: 5px;
    }
    .lcard.sel .lcard-num { color: white; }
    .lcard-label {
      font-size: 9px; font-weight: 600;
      color: var(--muted); line-height: 1.3;
    }
    .lcard.sel .lcard-label { color: rgba(255,255,255,.85); }

    /* Level description preview */
    .level-preview {
      margin-top: 12px; padding: 12px 14px;
      background: var(--bg); border-radius: 10px;
      border-left: 3px solid var(--cat);
      font-size: 12px; line-height: 1.6; color: var(--muted);
      min-height: 56px; display: none;
    }
    .level-preview.visible { display: block; animation: fadeIn .2s ease; }
    .level-preview strong { color: var(--text); }

    /* ─── Gap indicator ────────────────────────────────────── */
    .gap-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      margin: 16px 0 20px; display: none;
    }
    .gap-bar.positive { background: #ECFDF5; color: #175C3A; }
    .gap-bar.neutral  { background: var(--bg); color: var(--muted); }
    .gap-bar.negative { background: #FFF7ED; color: #8B3A00; }
    .gap-bar.visible  { display: flex; animation: fadeIn .2s ease; }

    /* ─── Notes ────────────────────────────────────────────── */
    .notes-area {
      width: 100%; padding: 12px 16px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--text); background: var(--bg);
      resize: vertical; min-height: 72px; outline: none;
      transition: border-color .2s, background .2s;
    }
    .notes-area:focus { border-color: var(--cat); background: white; }
    .notes-area::placeholder { color: #C8BFB8; }

    /* ─── Nav buttons ──────────────────────────────────────── */
    .nav-row {
      display: flex; gap: 12px; margin-top: 28px;
    }

    /* ─── Thank you ────────────────────────────────────────── */
    .ty-wrap {
      text-align: center; max-width: 480px;
      margin: auto; padding: 48px 16px;
    }
    .ty-check {
      width: 72px; height: 72px; border-radius: 50%;
      background: #ECFDF5; display: flex;
      align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 24px;
    }
    .ty-title {
      font-family: 'Fraunces', serif;
      font-size: 36px; font-weight: 600; margin-bottom: 14px;
    }
    .ty-msg {
      font-size: 16px; color: var(--muted); line-height: 1.75;
    }
    .ty-msg strong { color: var(--text); }
    .ty-stats {
      display: flex; justify-content: center; gap: 32px;
      margin-top: 32px; padding-top: 28px;
      border-top: 1px solid var(--border);
    }
    .ty-stat-num {
      font-family: 'Fraunces', serif;
      font-size: 32px; font-weight: 600; color: var(--cat);
    }
    .ty-stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ─── Save toast ───────────────────────────────────────── */
    #savingBadge {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--text); color: white;
      padding: 10px 18px; border-radius: 99px;
      font-size: 13px; font-weight: 500;
      display: none; align-items: center; gap: 8px;
      z-index: 300; box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    #savingBadge.show { display: flex; animation: fadeIn .2s; }
    .sm-spinner {
      width: 13px; height: 13px;
      border: 1.5px solid rgba(255,255,255,.3);
      border-top-color: white; border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ─── Mobile ───────────────────────────────────────────── */
    @media (max-width: 520px) {
      .card { padding: 24px 20px; }
      .svc-name { font-size: 22px; }
      .cat-heading { font-size: 34px; }
      .level-cards { gap: 5px; }
      .lcard { padding: 10px 2px 8px; }
      .lcard-num { font-size: 18px; }
      .lcard-label { font-size: 8px; }
      .applies-grid { grid-template-columns: repeat(3,1fr); gap: 8px; }
    }
  </style>
</head>
<body>

<div id="progressTrack"><div id="progressFill"></div></div>
<div id="app">
  <div class="screen-loading">
    <div class="spinner"></div>
    <p class="loading-text">Cargando evaluación…</p>
  </div>
</div>
<div id="savingBadge"><div class="sm-spinner"></div>Guardando…</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════ */
const SB_URL = 'https://yhmrxwloxwkjatxoqxhs.supabase.co';
const SB_KEY = 'sb_publishable_XZQk6N1xCuiSCJB10CbcHw_GkFuyJhJ';
const ORG    = 'Avila Tek';

const CATS = {
  strategic: {
    name: 'Estratégico', icon: '🎯',
    color: '#1B3575', rgb: '27,53,117', light: '#EEF2FF',
    desc: 'Servicios orientados a la alineación con la estrategia organizacional, la gobernanza del portafolio y la creación de valor sostenible a largo plazo. Definen el <em>por qué</em> y el <em>hacia dónde</em> de la PMO.'
  },
  tactical: {
    name: 'Táctico', icon: '⚙️',
    color: '#175C3A', rgb: '23,92,58', light: '#ECFDF5',
    desc: 'Servicios que aseguran la capacidad operativa de la PMO: metodologías, gestión de recursos, herramientas y desarrollo del equipo. Son la <em>infraestructura</em> que hace posible la ejecución.'
  },
  operational: {
    name: 'Operacional', icon: '🔧',
    color: '#7C2D12', rgb: '124,45,18', light: '#FFF7ED',
    desc: 'Servicios de ejecución directa en proyectos y programas. Aquí se gestiona el día a día: riesgos, calidad, cambios, interesados, desempeño y entrega. Son el <em>trabajo visible</em> de la PMO.'
  }
};

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
let sb, services = [], lvlMap = {}, responses = {}, session = null;
let steps = [], currentStep = 0;

const app      = document.getElementById('app');
const pFill    = document.getElementById('progressFill');
const pTrack   = document.getElementById('progressTrack');
const saving   = document.getElementById('savingBadge');

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
async function init() {
  sb = supabase.createClient(SB_URL, SB_KEY);

  const [{ data: svcs }, { data: lvls }] = await Promise.all([
    sb.from('pmo_services_catalog').select('*').order('sort_order'),
    sb.from('pmo_maturity_levels').select('*').order('service_id').order('level')
  ]);

  services = svcs || [];
  for (const l of (lvls || [])) {
    if (!lvlMap[l.service_id]) lvlMap[l.service_id] = [];
    lvlMap[l.service_id].push(l);
  }

  // Build step list
  steps = ['register'];
  for (const cat of ['strategic','tactical','operational']) {
    const catSvcs = services.filter(s => s.category === cat);
    steps.push('intro-' + cat);
    catSvcs.forEach(s => steps.push('svc-' + s.id));
  }
  steps.push('thankyou');

  // Resume session?
  const saved = localStorage.getItem('pmo_mat_sess');
  if (saved) {
    try {
      const sess = JSON.parse(saved);
      const { data } = await sb.from('pmo_assessment_sessions').select('*').eq('id', sess.id).single();
      if (data && data.status !== 'completed') {
        session = { id: data.id, token: data.assessor_token };
        const { data: rData } = await sb.from('pmo_service_assessments').select('*').eq('session_id', session.id);
        for (const r of (rData || [])) {
          responses[r.service_id] = {
            applies_status: r.applies_status,
            current_level:  r.current_level,
            desired_level:  r.desired_level,
            evidence_notes: r.evidence_notes
          };
        }
        // Find where to resume
        const answeredIds = Object.keys(responses).map(Number);
        if (answeredIds.length) {
          const lastId  = answeredIds[answeredIds.length - 1];
          const lastIdx = steps.indexOf('svc-' + lastId);
          currentStep   = Math.min(lastIdx + 1, steps.length - 2);
        } else {
          currentStep = 1; // skip register, go to first intro
        }
        render();
        return;
      }
    } catch(e) {}
    localStorage.removeItem('pmo_mat_sess');
  }

  currentStep = 0;
  render();
}

/* ═══════════════════════════════════════════════════════════
   RENDER ROUTER
═══════════════════════════════════════════════════════════ */
function render() {
  const step = steps[currentStep];
  const cat  = getCat();
  setCatVars(cat);
  updateProgress(cat);

  if (step === 'register')       renderRegister();
  else if (step.startsWith('intro-')) renderCatIntro(step.replace('intro-',''));
  else if (step.startsWith('svc-'))   renderService(parseInt(step.replace('svc-','')));
  else if (step === 'thankyou')       renderThankyou();
}

function getCat() {
  const step = steps[currentStep];
  if (!step || step === 'register' || step === 'thankyou') return 'strategic';
  if (step.startsWith('intro-')) return step.replace('intro-','');
  const id  = parseInt(step.replace('svc-',''));
  const svc = services.find(s => s.id === id);
  return svc ? svc.category : 'strategic';
}

function setCatVars(cat) {
  const c = CATS[cat];
  document.documentElement.style.setProperty('--cat',       c.color);
  document.documentElement.style.setProperty('--cat-light', c.light);
  document.documentElement.style.setProperty('--cat-rgb',   c.rgb);
}

function updateProgress(cat) {
  const svcSteps     = steps.filter(s => s.startsWith('svc-'));
  const answered     = Object.keys(responses).length;
  const pct          = svcSteps.length ? (answered / svcSteps.length) * 100 : 0;
  const isAssessment = steps[currentStep].startsWith('svc-') || steps[currentStep].startsWith('intro-');

  pTrack.style.display  = isAssessment ? 'block' : 'none';
  pFill.style.width     = pct + '%';
  pFill.style.background = CATS[cat].color;
}

/* ═══════════════════════════════════════════════════════════
   REGISTER SCREEN
═══════════════════════════════════════════════════════════ */
function renderRegister() {
  app.innerHTML = `
    <div class="card fade-up" style="margin-top:32px">
      <p class="reg-logo">PMO Maturity Assessment</p>
      <h1 class="reg-title">Evaluación de Madurez de Servicios PMO</h1>
      <p class="reg-sub">
        Evaluarás <strong>26 servicios PMO</strong> agrupados en categorías estratégica, táctica y operacional.
        Para cada servicio indicarás si aplica en tu PMO y los niveles de madurez <strong>actual</strong> y <strong>deseado</strong>.
      </p>
      <div class="form-group">
        <label class="form-label">Nombre completo</label>
        <input id="fName" class="form-input" type="text" placeholder="ej. Pedro Rodríguez" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label">Rol en la organización</label>
        <input id="fRole" class="form-input" type="text" placeholder="ej. PMO Coordinator" autocomplete="organization-title">
      </div>
      <div class="form-group">
        <label class="form-label">Nombre de esta evaluación</label>
        <input id="fEval" class="form-input" type="text" placeholder="ej. Evaluación Avila Tek — Mayo 2026">
      </div>
      <button class="btn-primary" id="btnStart">Comenzar evaluación →</button>
    </div>`;

  const go = handleRegister;
  document.getElementById('btnStart').onclick = go;
  ['fName','fRole','fEval'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => e.key === 'Enter' && go())
  );
}

async function handleRegister() {
  const name     = document.getElementById('fName').value.trim();
  const role     = document.getElementById('fRole').value.trim();
  const evalName = document.getElementById('fEval').value.trim();

  // Highlight empties
  let valid = true;
  ['fName','fRole','fEval'].forEach(id => {
    const el = document.getElementById(id);
    if (!el.value.trim()) { el.classList.add('error'); valid = false; }
    else el.classList.remove('error');
  });
  if (!valid) return;

  const btn = document.getElementById('btnStart');
  btn.disabled = true; btn.textContent = 'Iniciando…';

  const { data, error } = await sb.from('pmo_assessment_sessions').insert({
    name: evalName, organization: ORG,
    assessor_name: name, assessor_role: role,
    status: 'in_progress'
  }).select().single();

  if (error || !data) {
    btn.disabled = false; btn.textContent = 'Comenzar evaluación →';
    alert('Error al crear sesión. Recarga e intenta de nuevo.');
    return;
  }

  session = { id: data.id, token: data.assessor_token };
  localStorage.setItem('pmo_mat_sess', JSON.stringify(session));
  currentStep = 1;
  render();
}

/* ═══════════════════════════════════════════════════════════
   CATEGORY INTRO SCREEN
═══════════════════════════════════════════════════════════ */
function renderCatIntro(cat) {
  const c       = CATS[cat];
  const svcs    = services.filter(s => s.category === cat);
  const n       = svcs.length;
  const plural  = n === 1 ? 'servicio' : 'servicios';

  app.innerHTML = `
    <div class="cat-intro fade-up">
      <div class="cat-orb">${c.icon}</div>
      <div class="cat-badge-pill">${c.name}</div>
      <h2 class="cat-heading">${c.name}</h2>
      <p class="cat-desc">${c.desc}</p>
      <p class="cat-count-label">${n} ${plural} en esta categoría</p>
      <button class="btn-cat" id="btnCatGo">
        Evaluar ${plural} ${c.name.toLowerCase()}${cat === 'operational' ? 'es' : 's'} →
      </button>
    </div>`;

  document.getElementById('btnCatGo').onclick = () => { currentStep++; render(); };
}

/* ═══════════════════════════════════════════════════════════
   SERVICE SCREEN
═══════════════════════════════════════════════════════════ */
function renderService(svcId) {
  const svc   = services.find(s => s.id === svcId);
  if (!svc) return;

  const cat   = svc.category;
  const c     = CATS[cat];
  const lvls  = lvlMap[svc.id] || [];
  const resp  = responses[svc.id] ? { ...responses[svc.id] } : {};

  const svcSteps  = steps.filter(s => s.startsWith('svc-'));
  const svcIdx    = svcSteps.indexOf('svc-' + svc.id);
  const total     = svcSteps.length;
  const isLast    = svcIdx + 1 === total;
  const showLvl   = resp.applies_status === 'yes' || resp.applies_status === 'aspirational';
  const isFirstSvc = currentStep > 0 && steps[currentStep - 1]?.startsWith('intro-');

  const mkLcards = (type, selected) => lvls.map(l => `
    <div class="lcard ${selected === l.level ? 'sel' : ''}"
         data-level="${l.level}" data-type="${type}" data-svcid="${svc.id}"
         title="${l.description_es}">
      <span class="lcard-num">${l.level}</span>
      <span class="lcard-label">${l.title_es}</span>
    </div>`).join('');

  app.innerHTML = `
    <div class="card fade-up">

      <div class="svc-meta">
        <span class="svc-badge">${c.icon} ${c.name}</span>
        <span class="svc-counter">${svcIdx + 1}&thinsp;/&thinsp;${total}</span>
      </div>

      <h2 class="svc-name">${svc.name_es}</h2>
      <p class="svc-desc">${svc.short_description_es}</p>

      <div class="divider"></div>

      <p class="section-label">¿Este servicio aplica en tu PMO?</p>
      <div class="applies-grid">
        <div class="applies-opt ${resp.applies_status === 'yes'          ? 'sel' : ''}" data-val="yes">
          <span class="applies-emoji">✅</span>
          <span class="applies-label-text">Sí aplica</span>
          <span class="applies-hint">Activo o en desarrollo</span>
        </div>
        <div class="applies-opt ${resp.applies_status === 'no'           ? 'sel' : ''}" data-val="no">
          <span class="applies-emoji">⬜</span>
          <span class="applies-label-text">No aplica</span>
          <span class="applies-hint">Fuera de alcance actual</span>
        </div>
        <div class="applies-opt ${resp.applies_status === 'aspirational' ? 'sel' : ''}" data-val="aspirational">
          <span class="applies-emoji">🎯</span>
          <span class="applies-label-text">Aspiracional</span>
          <span class="applies-hint">Queremos implementarlo</span>
        </div>
      </div>

      <div id="levelsSection" style="display:${showLvl ? 'block' : 'none'}">

        <div class="levels-block">
          <div class="levels-header">
            <span class="levels-title">Nivel Actual</span>
            <span id="curRequired" class="${resp.applies_status === 'yes' ? 'levels-required' : 'levels-optional'}">
              ${resp.applies_status === 'yes' ? '* requerido' : 'opcional'}
            </span>
          </div>
          <div class="level-cards" id="curCards">${mkLcards('current', resp.current_level)}</div>
          <div id="curPreview" class="level-preview"></div>
        </div>

        <div class="levels-block">
          <div class="levels-header">
            <span class="levels-title">Nivel Deseado</span>
            <span class="levels-required">* requerido</span>
          </div>
          <div class="level-cards" id="desCards">${mkLcards('desired', resp.desired_level)}</div>
          <div id="desPreview" class="level-preview"></div>
        </div>

        <div id="gapBar" class="gap-bar"></div>

        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">Notas / Evidencia
            <span style="font-weight:300;text-transform:none;letter-spacing:0">(opcional)</span>
          </label>
          <textarea id="notesInput" class="notes-area"
            placeholder="Estado actual, evidencias, observaciones…">${resp.evidence_notes || ''}</textarea>
        </div>

      </div>

      <div class="nav-row">
        ${currentStep > 1 ? '<button class="btn-back" id="btnBack">← Anterior</button>' : ''}
        <button class="btn-next" id="btnNext" ${!resp.applies_status ? 'disabled' : ''}>
          ${isLast ? 'Finalizar evaluación ✓' : 'Siguiente →'}
        </button>
      </div>

    </div>`;

  /* ── local reactive state ── */
  let local = { ...resp };

  /* Applies options */
  document.querySelectorAll('.applies-opt').forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll('.applies-opt').forEach(o => o.classList.remove('sel'));
      opt.classList.add('sel');
      local.applies_status = opt.dataset.val;

      const showL = local.applies_status === 'yes' || local.applies_status === 'aspirational';
      document.getElementById('levelsSection').style.display = showL ? 'block' : 'none';

      const curReq = document.getElementById('curRequired');
      if (curReq) {
        curReq.className = local.applies_status === 'yes' ? 'levels-required' : 'levels-optional';
        curReq.textContent = local.applies_status === 'yes' ? '* requerido' : 'opcional';
      }

      if (!showL) { local.current_level = null; local.desired_level = null; }
      refreshGap(local);
      refreshNext(local, isLast);
    };
  });

  /* Level cards */
  document.querySelectorAll('.lcard').forEach(card => {
    card.onclick = () => {
      const type  = card.dataset.type;
      const level = parseInt(card.dataset.level);
      const lvl   = lvls.find(l => l.level === level);

      document.querySelectorAll(`.lcard[data-type="${type}"]`).forEach(c => c.classList.remove('sel'));
      card.classList.add('sel');

      if (type === 'current') {
        local.current_level = level;
        showPreview('curPreview', lvl);
      } else {
        local.desired_level = level;
        showPreview('desPreview', lvl);
      }

      refreshGap(local);
      refreshNext(local, isLast);
    };

    /* hover preview */
    card.addEventListener('mouseenter', () => {
      const type = card.dataset.type;
      const lvl  = lvls.find(l => l.level === parseInt(card.dataset.level));
      const pid  = type === 'current' ? 'curPreview' : 'desPreview';
      const sel  = local[type === 'current' ? 'current_level' : 'desired_level'];
      if (!sel) showPreview(pid, lvl, true);
    });
    card.addEventListener('mouseleave', () => {
      const type = card.dataset.type;
      const pid  = type === 'current' ? 'curPreview' : 'desPreview';
      const sel  = local[type === 'current' ? 'current_level' : 'desired_level'];
      if (!sel) hidePreview(pid);
    });
  });

  /* Pre-fill previews if already selected */
  if (resp.current_level) {
    const lvl = lvls.find(l => l.level === resp.current_level);
    if (lvl) showPreview('curPreview', lvl);
  }
  if (resp.desired_level) {
    const lvl = lvls.find(l => l.level === resp.desired_level);
    if (lvl) showPreview('desPreview', lvl);
  }

  /* Back */
  const btnBack = document.getElementById('btnBack');
  if (btnBack) {
    btnBack.onclick = () => {
      currentStep--;
      if (steps[currentStep]?.startsWith('intro-')) currentStep--; // skip intro going back
      render();
    };
  }

  /* Next */
  document.getElementById('btnNext').onclick = async () => {
    local.evidence_notes = document.getElementById('notesInput')?.value?.trim() || null;

    if (!local.applies_status) return;
    if (local.applies_status === 'yes' && !local.current_level) {
      alert('Por favor selecciona el nivel actual para este servicio.'); return;
    }
    if ((local.applies_status === 'yes' || local.applies_status === 'aspirational') && !local.desired_level) {
      alert('Por favor selecciona el nivel deseado para este servicio.'); return;
    }

    document.getElementById('btnNext').disabled = true;
    await saveResp(svc.id, local);
    responses[svc.id] = { ...local };

    currentStep++;
    if (steps[currentStep] === 'thankyou') await completeSession();
    render();
  };

  refreshNext(local, isLast);
}

/* helpers */
function showPreview(pid, lvl, soft = false) {
  const el = document.getElementById(pid);
  if (!el || !lvl) return;
  el.innerHTML = `<strong>${lvl.title_es}:</strong> ${lvl.description_es}`;
  el.className = `level-preview visible${soft ? ' soft' : ''}`;
}
function hidePreview(pid) {
  const el = document.getElementById(pid);
  if (el) el.classList.remove('visible');
}
function refreshGap(local) {
  const el = document.getElementById('gapBar');
  if (!el) return;
  if (local.current_level && local.desired_level) {
    const g = local.desired_level - local.current_level;
    el.classList.remove('positive','neutral','negative');
    el.classList.add('visible', g > 0 ? 'positive' : g < 0 ? 'negative' : 'neutral');
    el.innerHTML = g > 0
      ? `📈 Brecha de <strong>&nbsp;${g} nivel${g > 1 ? 'es' : ''}</strong>&nbsp; — hay potencial de mejora`
      : g < 0
      ? `📉 El nivel deseado es menor al actual — confirma si es intencional`
      : `✓ Nivel actual = nivel deseado — en punto óptimo para este servicio`;
  } else {
    el.classList.remove('visible');
  }
}
function refreshNext(local, isLast) {
  const btn = document.getElementById('btnNext');
  if (!btn) return;
  if (!local.applies_status) { btn.disabled = true; return; }
  if (local.applies_status === 'no') { btn.disabled = false; return; }
  if (local.applies_status === 'yes') { btn.disabled = !(local.current_level && local.desired_level); return; }
  if (local.applies_status === 'aspirational') { btn.disabled = !local.desired_level; return; }
}

/* ═══════════════════════════════════════════════════════════
   THANK YOU
═══════════════════════════════════════════════════════════ */
function renderThankyou() {
  pTrack.style.display = 'none';
  const answered   = Object.keys(responses).length;
  const applies    = Object.values(responses).filter(r => r.applies_status === 'yes').length;
  const aspirat    = Object.values(responses).filter(r => r.applies_status === 'aspirational').length;
  const avgGap     = (() => {
    const gaps = Object.values(responses)
      .filter(r => r.current_level && r.desired_level)
      .map(r => r.desired_level - r.current_level);
    return gaps.length ? (gaps.reduce((a,b) => a+b,0) / gaps.length).toFixed(1) : '—';
  })();

  app.innerHTML = `
    <div class="ty-wrap fade-up">
      <div class="ty-check">✅</div>
      <h2 class="ty-title">¡Evaluación completada!</h2>
      <p class="ty-msg">
        Gracias por completar la evaluación de madurez PMO.<br>
        Tus respuestas han sido registradas y el equipo de la PMO las revisará para generar el análisis de madurez.
      </p>
      <div class="ty-stats">
        <div>
          <div class="ty-stat-num" style="color:var(--cat)">${answered}</div>
          <div class="ty-stat-label">servicios evaluados</div>
        </div>
        <div>
          <div class="ty-stat-num" style="color:#175C3A">${applies}</div>
          <div class="ty-stat-label">servicios activos</div>
        </div>
        <div>
          <div class="ty-stat-num" style="color:#7C2D12">${avgGap}</div>
          <div class="ty-stat-label">brecha promedio</div>
        </div>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════
   SUPABASE HELPERS
═══════════════════════════════════════════════════════════ */
async function saveResp(svcId, resp) {
  saving.classList.add('show');
  await sb.from('pmo_service_assessments').upsert({
    session_id:     session.id,
    service_id:     svcId,
    applies_status: resp.applies_status,
    current_level:  resp.current_level  || null,
    desired_level:  resp.desired_level  || null,
    evidence_notes: resp.evidence_notes || null
  }, { onConflict: 'session_id,service_id' });
  setTimeout(() => saving.classList.remove('show'), 900);
}

async function completeSession() {
  await sb.from('pmo_assessment_sessions')
    .update({ status: 'completed', completed_at: new Date().toISOString() })
    .eq('id', session.id);
  localStorage.removeItem('pmo_mat_sess');
}

/* ═══════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════ */
init().catch(() => {
  app.innerHTML = `
    <div style="text-align:center;padding:80px 20px;color:var(--muted)">
      <p style="font-size:32px;margin-bottom:12px">⚠️</p>
      <p style="font-size:16px">Error al cargar la evaluación.<br>Recarga la página para intentar de nuevo.</p>
    </div>`;
});
</script>
